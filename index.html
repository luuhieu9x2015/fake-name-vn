<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Fake Name VN</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json" />

    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f5f5;
      }

      .header {
        padding: 20px;
        text-align: center;
        font-size: 22px;
        font-weight: bold;
      }

      .result {
        text-align: center;
        font-size: 18px;
        margin-top: 10px;
        font-weight: bold;
      }

      .form-box {
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 400px;
        margin: auto;
      }

      .form-box input {
        padding: 12px;
        font-size: 18px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
      }

      .form-buttons {
        display: flex;
        gap: 10px;
      }

      .form-buttons button {
        flex: 1;
        padding: 12px;
        font-size: 18px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        color: white;
      }

      .btn-set {
        background: #ff9800;
      }

      .btn-clear {
        background: #f44336;
      }

      .form-buttons button:active {
        opacity: 0.85;
      }

      /* ===== BUTTON FULL SCREEN ===== */
      .btn-full {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100vw;
        display: flex;
      }

      .btn-full button {
        width: 50vw;
        height: 80px;
        font-size: 20px;
        font-weight: bold;
        border: none;
        border-radius: 0;
        color: #fff;
        cursor: pointer;
      }

      .btn-first {
        background: #4caf50;
      }

      .btn-last {
        background: #2196f3;
      }

      .btn-full button:active {
        opacity: 0.85;
      }

      /* tránh bị che bởi button dưới */
      .spacer {
        height: 90px;
      }
    </style>
  </head>

  <body>
    <div class="header">Fake Name VN 🇻🇳</div>

    <div class="form-box">
      <input id="inputFirst" type="text" placeholder="Nhập Họ (vd: Nguyễn)" />
      <input id="inputLast" type="text" placeholder="Nhập Tên (vd: Ngọc Hà)" />

      <div class="form-buttons">
        <button class="btn-set" onclick="setName()">SET</button>
        <button class="btn-clear" onclick="clearName()">CLEAR</button>
      </div>
    </div>

    <div class="result" id="result">Bấm nút để copy</div>

    <div class="spacer"></div>

    <!-- BUTTONS -->
    <div class="btn-full">
      <button class="btn-first" onclick="copyFirstName()">Copy Họ</button>
      <button class="btn-last" onclick="copyLastName()">Copy Tên</button>
    </div>

    <script>
      const firstNames = [
        "Nguyễn","Trần","Lê","Phạm","Hoàng","Võ","Đặng","Bùi",
        "Đỗ","Phan","Vũ","Ngô","Lý","Đoàn","Lâm","Trịnh","Lưu"
      ];

      const lastNames = [
        "Bảo Ngọc","Diệu Linh","Đan Thanh","Gia Hân","Hải Yến",
        "Hồng Nhung","Khánh Linh","Linh Chi","Mai Phương",
        "Minh Châu","Ngọc Bích","Phương Thảo","Thanh Hằng",
        "Thảo Vy","Thu Minh","Thùy Dung","Tuyết Mai","Uyên Nhi",
        "Vân Khánh","Xuân Mai","Yến Nhi","Bảo Trâm","Diễm My",
        "Đoan Trang","Gia Linh","Hải Hà","Hồng Hạnh","Kim Ngân",
        "Khánh Vy","Minh Nguyệt","Ngọc Trâm","Phương Linh",
        "Quế Chi","Thanh Mai","Trà My","Tuyết Lan"
      ];

      let customFirst = "";
      let customLast = "";

      function randomItem(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      // ===== CLIPBOARD SAFE FOR PWABUILDER =====
      function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "absolute";
          textarea.style.left = "-9999px";
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand("copy");
          document.body.removeChild(textarea);
        }
      }

      function setName() {
        customFirst = document.getElementById("inputFirst").value.trim();
        customLast = document.getElementById("inputLast").value.trim();

        let msg = "Đã set: ";
        msg += (customFirst ? "Họ=" + customFirst : "Họ=Random");
        msg += " | ";
        msg += (customLast ? "Tên=" + customLast : "Tên=Random");

        document.getElementById("result").innerText = msg;
      }

      function clearName() {
        document.getElementById("inputFirst").value = "";
        document.getElementById("inputLast").value = "";

        customFirst = "";
        customLast = "";

        document.getElementById("result").innerText =
          "Đã clear input → sẽ random lại";
      }

      function copyFirstName() {
        const name = customFirst ? customFirst : randomItem(firstNames);
        copyText(name);
        document.getElementById("result").innerText = "Đã copy Họ: " + name;
      }

      function copyLastName() {
        const name = customLast ? customLast : randomItem(lastNames);
        copyText(name);
        document.getElementById("result").innerText = "Đã copy Tên: " + name;
      }
    </script>
  </body>
</html>
